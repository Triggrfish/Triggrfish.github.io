<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="301.7829" height="290.17903" viewBox="0,0,301.7829,290.17903"><g transform="translate(-29.13264,-42.75521)"><g stroke="none" stroke-miterlimit="10"><path d="M83.11077,87.46118v-6.24657h1.06649v6.24657z" fill="#1e1431" stroke-width="0"/><path d="M29.13264,332.93424v-290.17903h299.74537v290.17903z" fill="#4d0057" stroke-width="0"/><text transform="translate(37.17182,56.95009) scale(0.18616,0.18616)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Sitka Display&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">机制：</tspan><tspan x="0" dy="46.150000000000006px">· 数据管理特化：获得25%数据抗性，但获得的护甲和生命回复降低45%。</tspan><tspan x="0" dy="46.150000000000006px">· 像素塔星盘：拥有星盘，可影响部分技能效果。</tspan><tspan x="0" dy="46.150000000000006px">· 死亡印记：有单位阵亡后，获得额外视野，移速和数据精确度，持续至造成/受到伤害</tspan><tspan x="0" dy="46.150000000000006px">                       后的1秒。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">普通攻击：管制者短刃</tspan><tspan x="0" dy="46.150000000000006px">重攻击：DeathMark蓄力并驱动机械环进行冲击。推开近距离敌人并对其他敌人造成流血。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Q-数据切削      CD：14/12/10     能量</tspan><tspan x="0" dy="46.150000000000006px">点按/&lt;50%蓄力：DeathMark使短刃化为镰刀并挥舞，对敌人造成基于已损生命值的伤害。</tspan><tspan x="0" dy="46.150000000000006px">50%蓄力：转而造成基于最大生命值的数据伤害。</tspan><tspan x="0" dy="46.150000000000006px">&gt;50%蓄力：取消释放该技能并把冷却设为2/1.5/1秒。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">W-像素塔笔记      CD：9/7.5/6      能量</tspan><tspan x="0" dy="46.150000000000006px">DeathMark布置档案并向后位移。档案一定延迟后爆发，对扇形范围的敌人造成伤害。</tspan><tspan x="0" dy="46.150000000000006px">可以从星盘上选择1/2/3个附魔给此技能。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">E-盈能流星     CD：8     可充能2次      能量</tspan><tspan x="0" dy="46.150000000000006px">被动：DeathMark基于当前能量获得额外穿甲。</tspan><tspan x="0" dy="46.150000000000006px">主动：DeathMark召唤两颗飞向指针位置的流星。流星的方向取决于星盘的指针。流星</tspan><tspan x="0" dy="46.150000000000006px">造成伤害和星火效果。星火效果会对生命值低于R技能阈值的敌人造成标记和15%减速。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">R-“Chanceless”     CD：55       能量</tspan><tspan x="0" dy="46.150000000000006px">主动：DeathMark传送到指定区域并进行一次斩击，使敌人进入宕机，持续2秒。如果</tspan><tspan x="0" dy="46.150000000000006px">敌人生命值低于7/10/13%，则宕机延长400%，并在状态结束后回复-99999生命值。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text></g></g></svg>