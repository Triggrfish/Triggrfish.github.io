<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="77.52147" height="21.97314" viewBox="0,0,77.52147,21.97314"><g transform="translate(-235.49288,-173.97817)"><g stroke-miterlimit="10"><text transform="translate(235.54562,189.70666) scale(0.05866,0.05866)" font-size="40" xml:space="preserve" fill="#d5d5d5" stroke="#744dc2" stroke-width="0" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">造成伤害时，有5%的概率伤害变为500%。</tspan><tspan x="0" dy="48px">此外，击杀一名敌人时，所有其他敌人会受到20%最大生命值的数据伤害。</tspan></text><text transform="translate(246.06965,177.68169) scale(0.08379,0.08379)" font-size="40" xml:space="preserve" fill="#d800ff" stroke="#420082" stroke-width="2" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">灭绝</tspan></text><text transform="translate(235.49289,195.35054) scale(0.05215,0.05215)" font-size="40" xml:space="preserve" fill="#9e9e9e" stroke="#744dc2" stroke-width="0" font-family="Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">他们，不，它们输了。</tspan></text><text transform="translate(246.04468,180.20845) scale(0.0469,0.0469)" font-size="40" xml:space="preserve" fill="#255a63" stroke="#7300ff" stroke-width="0" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">旧时代遗留的残次品</tspan></text><image x="471.5" y="349.5" transform="scale(0.5,0.5)" width="17" height="21" xlink:href="data:image/png;base64," fill="none" stroke="none" stroke-width="0.5"/></g></g></svg>