<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="302.12359" height="290.17903" viewBox="0,0,302.12359,290.17903"><g transform="translate(-29.13264,-42.75521)"><g stroke="none" stroke-miterlimit="10"><path d="M29.13264,332.93424v-290.17903h299.74537v290.17903z" fill="#4d0057" stroke-width="0"/><text transform="translate(37.17182,56.95009) scale(0.18616,0.18616)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;Sitka Display&quot;, Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">机制：</tspan><tspan x="0" dy="46.150000000000006px">· 改装霰弹枪：Theo的普通攻击造成群体伤害且视为技能，对近距离的敌人造成两次伤害。</tspan><tspan x="0" dy="46.150000000000006px">· 外勤装备：Theo受伤后会暂时叠加一层效果，降低自身视野范围。</tspan><tspan x="0" dy="46.150000000000006px">· 冰原行进鼓：生命值低于33%时受到伤害，在5秒内原地引发5次震波，造成伤害并令</tspan><tspan x="0" dy="46.150000000000006px">                           碰到的膨化原料炸开。（CD：40）                  </tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">普通攻击：改装电磁霰弹枪</tspan><tspan x="0" dy="46.150000000000006px">重攻击：Theo举枪格挡，期间获得免伤和额外护甲。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Q-霰弹枪收束      CD：12/10/8      能量</tspan><tspan x="0" dy="46.150000000000006px">被动：Theo获得额外护甲。</tspan><tspan x="0" dy="46.150000000000006px">主动：Theo在接下来5秒内，普通攻击距离扩大，并一定造成两次伤害。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">W-膨化原料      CD：3      可充能五次      能量</tspan><tspan x="0" dy="46.150000000000006px">Theo获得少量护盾并投掷一个膨化原料。膨化原料可以停留在平台上。他首次碰到每个</tspan><tspan x="0" dy="46.150000000000006px">膨化原料时，获得护盾并刷新该技能护盾的持续时间。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">E-瓦解电子     CD：9/8/7      能量</tspan><tspan x="0" dy="46.150000000000006px">Theo发射一个电荷并因后坐力向后位移。电荷造成伤害并降低敌人护甲。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">R-膨化爆破      CD：70/60/50      能量</tspan><tspan x="0" dy="46.150000000000006px">Theo发射连他自己也看不见的膨化波。碰到膨化波的膨化原料会炸开，持续5秒。</tspan><tspan x="0" dy="46.150000000000006px">炸开的膨化原料对上方敌人持续造成伤害，减速和酥脆。</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text></g></g></svg>